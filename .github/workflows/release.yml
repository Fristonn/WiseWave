name: Release

on:
  push:
    branches:
      - main
    paths:
      - src/app/version.ts
  workflow_dispatch:
    inputs:
      replace_version:
        description: Existing Latest version to replace without changing its version number
        type: string
        required: false

concurrency:
  group: windows-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go.sum
            src/runtime/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows releases
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if (-not $env:MYGO_UPDATER_PRIVATE_KEY) { throw "Missing MYGO_UPDATER_PRIVATE_KEY secret." }
          npx mygo build -platform windows/amd64,windows/arm64
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }
          foreach ($architecture in @("amd64", "arm64")) {
            if (-not (Test-Path "dist/windows-$architecture/update-windows-$architecture.json")) { throw "Missing signed update for $architecture." }
          }

      - name: Upload Windows amd64 build
        uses: actions/upload-artifact@v4
        with:
          name: wisewave-windows-amd64
          path: dist/windows-amd64/wisewave-setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows arm64 build
        uses: actions/upload-artifact@v4
        with:
          name: wisewave-windows-arm64
          path: dist/windows-arm64/wisewave-setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_VERSION: ${{ inputs.replace_version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          function Invoke-GitHub {
            & gh @args
            if ($LASTEXITCODE -ne 0) { throw "GitHub release command failed: $($args[0..1] -join ' ')" }
          }

          function Set-AssetUrl($entry, $asset) {
            $suffix = "/$($asset.Name)"
            if ($entry.url -cne "$generatedBase$suffix" -or $entry.size -ne $asset.Length -or !$entry.signature) {
              throw "Invalid update metadata for $($asset.Name)."
            }
            $entry.url = "$releaseBase$suffix"
          }

          $versionSource = Get-Content -LiteralPath "src/app/version.ts" -Raw
          if ($versionSource -notmatch 'appVersion\s*=\s*"(\d+\.\d+\.\d+)"') { throw "Could not read app version." }
          $version = $Matches[1]
          $latestTag = gh release view --json tagName --jq ".tagName"
          if ($LASTEXITCODE -eq 0 -and $latestTag -match '^\d+\.\d+\.\d+$' -and [version]$latestTag -gt [version]$version) {
            throw "Cannot replace $latestTag with an older version."
          }

          $replace = ![string]::IsNullOrWhiteSpace($env:REPLACE_VERSION)
          if ($replace -and ($env:GITHUB_REF -cne "refs/heads/main" -or $env:REPLACE_VERSION -cne $version -or $latestTag -cne $version)) {
            throw "Replacement must match the build and the current Latest release."
          }

          $downloadBase = "https://github.com/$env:GITHUB_REPOSITORY/releases/download"
          $generatedBase = "$downloadBase/v$version"
          $releaseBase = "$downloadBase/$version"
          $patchNotes = $null
          $assets = @()
          foreach ($architecture in @("amd64", "arm64")) {
            $dir = "dist/windows-$architecture"
            $installer = Get-Item -LiteralPath "$dir/wisewave-setup-$version-$architecture.exe"
            $manifest = Get-Item -LiteralPath "$dir/update-windows-$architecture.json"
            $metadata = Get-Content -LiteralPath $manifest.FullName -Raw | ConvertFrom-Json
            $archive = Get-Item -LiteralPath "$dir/wisewave-$version-windows-$architecture.tar.gz"
            if ($metadata.version -cne $version) { throw "Incorrect update version for $architecture." }
            if ([string]::IsNullOrWhiteSpace($metadata.notes) -or ($patchNotes -and $patchNotes -cne $metadata.notes)) {
              throw "Missing or inconsistent patch notes for $architecture."
            }
            $patchNotes = $metadata.notes

            Set-AssetUrl $metadata $archive
            foreach ($delta in $metadata.deltas) {
              $name = "wisewave-$($delta.from)-to-$version-windows-$architecture.delta"
              $asset = Get-Item -LiteralPath "$dir/$name"
              Set-AssetUrl $delta $asset
              $assets += $asset.FullName
            }
            [IO.File]::WriteAllText($manifest.FullName, ($metadata | ConvertTo-Json -Depth 20) + "`n")

            $stable = Join-Path $installer.DirectoryName "wisewave-setup-$architecture.exe"
            Copy-Item -LiteralPath $installer.FullName -Destination $stable -Force
            $assets += $stable, $manifest.FullName, $archive.FullName
          }

          $notes = "### what's new`n`n$patchNotes"
          $existingJson = gh release view $version --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -ne 0) {
            Invoke-GitHub release create $version --latest --target $env:GITHUB_SHA --title "WiseWave $version" --notes $notes -- @assets
          } else {
            $existing = $existingJson | ConvertFrom-Json
            $releaseCommit = if ($existing.isDraft) { $existing.targetCommitish } else {
              Invoke-GitHub api "repos/$env:GITHUB_REPOSITORY/commits/$version" --jq ".sha"
            }
            if ($releaseCommit -ne $env:GITHUB_SHA -and !$replace) { throw "$version already belongs to another commit." }
            Invoke-GitHub release upload $version --clobber -- @assets
            if ($releaseCommit -ne $env:GITHUB_SHA) {
              Invoke-GitHub api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$version" -f "sha=$env:GITHUB_SHA" -F force=true --silent
            }
            Invoke-GitHub release edit $version --draft=false --latest --title "WiseWave $version" --notes $notes
          }
