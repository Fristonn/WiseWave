name: Release

on:
  push:
    branches:
      - main
    paths:
      - src/app/version.ts
  workflow_dispatch:
    inputs:
      replace_version:
        description: Existing Latest version to replace without changing its version number
        type: string
        required: false

concurrency:
  group: windows-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go.sum
            src/runtime/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows releases
        shell: pwsh
        run: |
          npx mygo build -platform windows/amd64,windows/arm64
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }

      - name: Upload Windows amd64 build
        uses: actions/upload-artifact@v4
        with:
          name: wisewave-windows-amd64
          path: dist/windows-amd64/wisewave-setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows arm64 build
        uses: actions/upload-artifact@v4
        with:
          name: wisewave-windows-arm64
          path: dist/windows-arm64/wisewave-setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          REPLACE_VERSION: ${{ inputs.replace_version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          function Invoke-GitHub {
            & gh @args
            if ($LASTEXITCODE -ne 0) { throw "GitHub release command failed: $($args[0..1] -join ' ')" }
          }

          $versionSource = Get-Content -LiteralPath "src/app/version.ts" -Raw
          if ($versionSource -notmatch 'appVersion\s*=\s*"(\d+\.\d+\.\d+)"') { throw "Could not read app version." }
          $version = $Matches[1]
          $latestTag = gh release view --json tagName --jq ".tagName"
          if ($LASTEXITCODE -eq 0 -and $latestTag -match '^\d+\.\d+\.\d+$' -and [version]$latestTag -gt [version]$version) {
            throw "Cannot replace $latestTag with an older version."
          }

          $replace = ![string]::IsNullOrWhiteSpace($env:REPLACE_VERSION)
          if ($replace -and ($env:GITHUB_REF -cne "refs/heads/main" -or $env:REPLACE_VERSION -cne $version -or $latestTag -cne $version)) {
            throw "Replacement must match the build and the current Latest release."
          }

          $assets = @()
          foreach ($architecture in @("amd64", "arm64")) {
            $dir = "dist/windows-$architecture"
            $installer = Get-Item -LiteralPath "$dir/wisewave-setup-$version-$architecture.exe"
            $stable = Join-Path $installer.DirectoryName "wisewave-setup-$architecture.exe"
            Copy-Item -LiteralPath $installer.FullName -Destination $stable -Force
            $assets += $stable
          }

          $notes = Join-Path $env:RUNNER_TEMP "wisewave-release-notes.md"
          go run ./scripts/release-notes $version $assets[0] $assets[1] $notes
          if ($LASTEXITCODE -ne 0) { throw "Could not sign the Windows release." }

          $existingJson = gh release view $version --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -ne 0) {
            Invoke-GitHub release create $version --latest --target $env:GITHUB_SHA --title "WiseWave $version" --notes-file $notes -- @assets
          } else {
            $existing = $existingJson | ConvertFrom-Json
            $releaseCommit = if ($existing.isDraft) { $existing.targetCommitish } else {
              Invoke-GitHub api "repos/$env:GITHUB_REPOSITORY/commits/$version" --jq ".sha"
            }
            if ($releaseCommit -ne $env:GITHUB_SHA -and !$replace) { throw "$version already belongs to another commit." }
            Invoke-GitHub release upload $version --clobber -- @assets
            if ($releaseCommit -ne $env:GITHUB_SHA) {
              Invoke-GitHub api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$version" -f "sha=$env:GITHUB_SHA" -F force=true --silent
            }
            Invoke-GitHub release edit $version --draft=false --latest --title "WiseWave $version" --notes-file $notes
            $installerNames = $assets | ForEach-Object { Split-Path -Leaf $_ }
            $assetNames = Invoke-GitHub release view $version --json assets --jq ".assets[].name"
            foreach ($name in $assetNames) {
              if ($name -notin $installerNames) {
                Invoke-GitHub release delete-asset $version $name --yes
              }
            }
          }
