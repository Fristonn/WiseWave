name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go.sum
            src/runtime/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows releases
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if (-not $env:MYGO_UPDATER_PRIVATE_KEY) { throw "Missing MYGO_UPDATER_PRIVATE_KEY secret." }
          $versionSource = Get-Content -LiteralPath "src/app/version.ts" -Raw
          if ($versionSource -notmatch 'appVersion\s*=\s*"(\d+\.\d+)\.\d+"') { throw "Could not read app version." }
          $version = "$($Matches[1]).$env:GITHUB_RUN_NUMBER"
          Set-Content -LiteralPath "src/app/version.ts" -Value "export const appVersion = `"$version`";"
          npx mygo build -platform windows/amd64,windows/arm64
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }
          foreach ($architecture in @("amd64", "arm64")) {
            if (-not (Test-Path "dist/windows-$architecture/update-windows-$architecture.json")) { throw "Missing signed update for $architecture." }
          }

      - name: Upload Windows amd64 build
        uses: actions/upload-artifact@v4
        with:
          name: wisewave-windows-amd64
          path: dist/windows-amd64/wisewave-setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows arm64 build
        uses: actions/upload-artifact@v4
        with:
          name: wisewave-windows-arm64
          path: dist/windows-arm64/wisewave-setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          function Invoke-GitHub {
            & gh @args
            if ($LASTEXITCODE -ne 0) { throw "GitHub release command failed: $($args[0..1] -join ' ')" }
          }

          $tag = "latest"
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $versionSource = Get-Content -LiteralPath "src/app/version.ts" -Raw
          if ($versionSource -notmatch 'appVersion\s*=\s*"([^"]+)"') { throw "Could not read app version." }
          $version = $Matches[1]
          $updateTag = "v$version"
          $notes = @"
          Latest WiseWave for Windows.

          - [Download for Intel or AMD](https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/wisewave-setup-amd64.exe)
          - [Download for Windows on ARM](https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/wisewave-setup-arm64.exe)

          Build: $short
          "@
          $installers = @()
          $manifests = @()
          $archives = @()
          foreach ($architecture in @("amd64", "arm64")) {
            $dir = "dist/windows-$architecture"
            $installer = Get-Item -LiteralPath "$dir/wisewave-setup-$version-$architecture.exe"
            $manifest = Get-Item -LiteralPath "$dir/update-windows-$architecture.json"
            $metadata = Get-Content -LiteralPath $manifest.FullName -Raw | ConvertFrom-Json
            $archive = Get-Item -LiteralPath "$dir/wisewave-$version-windows-$architecture.tar.gz"
            $expectedUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$updateTag/$($archive.Name)"
            if ($metadata.version -ne $version -or $metadata.url -ne $expectedUrl -or $metadata.size -ne $archive.Length -or !$metadata.signature) {
              throw "Invalid update manifest for $architecture."
            }

            $stable = Join-Path $installer.DirectoryName "wisewave-setup-$architecture.exe"
            Copy-Item -LiteralPath $installer.FullName -Destination $stable -Force
            $installers += $stable
            $manifests += $manifest.FullName
            $archives += $archive.FullName
            $archives += @(Get-ChildItem -LiteralPath $dir -File -Filter "*.delta" | ForEach-Object FullName)
          }

          gh release view $updateTag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Invoke-GitHub release upload $updateTag --clobber -- @archives
          } else {
            Invoke-GitHub release create $updateTag --prerelease --latest=false --target $env:GITHUB_SHA --title "WiseWave $version update files" --notes "Signed files for automatic updates. Download WiseWave from the latest release." -- @archives
          }

          $publicAssets = @($installers) + @($manifests)
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Invoke-GitHub release upload $tag --clobber -- @publicAssets
            Invoke-GitHub api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f "sha=$env:GITHUB_SHA" -F force=true --silent
            Invoke-GitHub release edit $tag --latest --title "WiseWave $version" --notes $notes
          } else {
            Invoke-GitHub release create $tag --latest --target $env:GITHUB_SHA --title "WiseWave $version" --notes $notes -- @publicAssets
          }

          $assetNames = Invoke-GitHub release view $tag --json assets --jq ".assets[].name"
          foreach ($asset in $assetNames) {
            if ($asset -match '^wisewave-setup-\d+\.\d+\.\d+-(amd64|arm64)\.exe$' -or
                $asset -match '^wisewave-.*\.(tar\.gz|delta)$') {
              Invoke-GitHub release delete-asset $tag $asset --yes
            }
          }
